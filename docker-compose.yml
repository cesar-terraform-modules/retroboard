services:
  localstack:
    build:
      context: ./localstack
      dockerfile: Dockerfile
    container_name: retroboard-localstack
    expose:
      - "4566"
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sqs,sns,ses
      - AWS_DEFAULT_REGION=us-east-1
    labels:
      # Ready only after init-aws.sh has created the table/queue/topic.
      shipyard.readiness.exec.command: '["sh", "-c", "curl -sf localhost:4566/_localstack/init/ready | grep -q SUCCESSFUL"]'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -q SUCCESSFUL"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - retroboard-network

  api:
    build:
      context: ./functions/api
      dockerfile: Dockerfile
    container_name: retroboard-api
    labels:
      shipyard.route: "/api"
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCOUNT_ID=000000000000
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - ROOT_PATH=/api
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/docs').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - retroboard-network
    volumes:
      - ./functions/api:/app
    command: python main.py
    depends_on:
      localstack:
        condition: service_healthy

  email-summary:
    build:
      context: ./functions/email-summary
      dockerfile: Dockerfile
    container_name: retroboard-email-summary
    ports:
      - "8001:8000"
    environment:
      - SES_SENDER_EMAIL_ADDRESS=${SES_SENDER_EMAIL_ADDRESS:-noreply@example.com}
      - TEMPLATE_NAME=${TEMPLATE_NAME:-retroboard-summary}
      - PORT=8000
      - AWS_REGION=us-east-1
      - AWS_ACCOUNT_ID=000000000000
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    networks:
      - retroboard-network
    volumes:
      - ./functions/email-summary:/app
    command: python main.py
    depends_on:
      - localstack

  notification-service:
    build:
      context: ./functions/notification-service
      dockerfile: Dockerfile
    container_name: retroboard-notification-service
    ports:
      - "8002:8000"
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-http://localhost:3001/webhook}
      - PORT=8000
      - AWS_REGION=us-east-1
      - AWS_ACCOUNT_ID=000000000000
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    networks:
      - retroboard-network
    volumes:
      - ./functions/notification-service:/app
    command: python main.py
    depends_on:
      - localstack

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        # Same-origin: Shipyard routes /api to the api service; locally nginx proxies it.
        # Literal on purpose: Shipyard build args can't interpolate ${SHIPYARD_DOMAIN}.
        NEXT_PUBLIC_API_HOST_URL: /api
    container_name: retroboard-app
    labels:
      shipyard.route: "/"
      shipyard.primary-route: "true"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - retroboard-network
    depends_on:
      api:
        condition: service_healthy

networks:
  retroboard-network:
    driver: bridge
